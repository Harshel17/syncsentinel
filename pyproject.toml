[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncsentinel"
version = "0.2.0"
description = "A deterministic reliability companion demonstration for Stacksync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/syncsentinel"]
